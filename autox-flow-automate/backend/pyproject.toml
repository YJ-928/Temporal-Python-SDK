[project]
name = "flowautomate-backend"
version = "1.0.0"
description = "FlowAutomate — AutoX Visual Workflow Automation Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "temporalio>=1.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311", "S110"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
